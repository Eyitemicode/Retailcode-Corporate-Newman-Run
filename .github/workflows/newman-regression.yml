name: RetailCode Corporate API Regression

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Every Monday at 12:00 PM UTC
    - cron: "0 12 * * 1"

jobs:
  run-newman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman and reporters
        run: |
          npm install -g newman newman-reporter-htmlextra
          sudo apt-get install -y jq

      - name: Run API Regression Tests
        run: |
          mkdir -p ./reports
          newman run "Corporate_batch_one.postman_collection.postman_collection.json" \
            --environment "Corporate Dev.postman_environment.json" \
            --reporters cli,htmlextra,json \
            --reporter-htmlextra-export "./reports/RetailCode-Corporate-Test-Report.html" \
            --reporter-htmlextra-title "RetailCode Corporate API Test Report" \
            --reporter-htmlextra-browserTitle "RetailCode Corporate API Tests" \
            --reporter-htmlextra-showEnvironmentData \
            --reporter-htmlextra-logs \
            --reporter-json-export "./reports/summary.json" \
            --timeout-request 30000 \
            --delay-request 500 \
            --insecure || true

      - name: Extract Test Summary
        id: summary
        run: |
          PASS_COUNT=$(jq '.run.stats.assertions.total - .run.stats.assertions.failed' ./reports/summary.json)
          FAIL_COUNT=$(jq '.run.stats.assertions.failed' ./reports/summary.json)
          TOTAL=$(jq '.run.stats.assertions.total' ./reports/summary.json)
          DURATION=$(jq -r '"\(.run.timings.completed - .run.timings.started) ms"' ./reports/summary.json)
          RUN_DATE=$(date -u "+%Y-%m-%d %H:%M UTC")
          echo "pass_count=$PASS_COUNT"  >> $GITHUB_OUTPUT
          echo "fail_count=$FAIL_COUNT"  >> $GITHUB_OUTPUT
          echo "total=$TOTAL"            >> $GITHUB_OUTPUT
          echo "duration=$DURATION"      >> $GITHUB_OUTPUT
          echo "run_date=$RUN_DATE"      >> $GITHUB_OUTPUT

      - name: Upload HTML Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-report
          path: ./reports/RetailCode-Corporate-Test-Report.html
          retention-days: 30

      - name: Upload report to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          # Upload HTML report
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/latest-report" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: text/html" \
            --data-binary @./reports/RetailCode-Corporate-Test-Report.html

          # Upload metadata
          REPORT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          META=$(jq -n \
            --arg runDate    "${{ steps.summary.outputs.run_date }}" \
            --arg passed     "${{ steps.summary.outputs.pass_count }}" \
            --arg failed     "${{ steps.summary.outputs.fail_count }}" \
            --arg total      "${{ steps.summary.outputs.total }}" \
            --arg duration   "${{ steps.summary.outputs.duration }}" \
            --arg reportUrl  "$REPORT_URL" \
            '{runDate:$runDate, passed:$passed, failed:$failed, total:$total, duration:$duration, reportUrl:$reportUrl}')

          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/latest-meta" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$META"

      - name: Trigger Cloudflare Worker to send email notifications
        env:
          WORKER_NOTIFY_URL: ${{ secrets.WORKER_NOTIFY_URL }}
        run: |
          curl -s -X POST "${WORKER_NOTIFY_URL}/notify" \
            -H "Content-Type: application/json" \
            -d '{"source":"github-actions"}'
