name: RetailCode Corporate API Regression

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 9 * * 1"   # Every Monday at 10:00 AM WAT (Nigeria) = 09:00 AM UTC

jobs:
  run-newman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman and reporters
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Run API Regression Tests
        run: |
          mkdir -p ./reports
          newman run "Corporate_batch_one.postman_collection.postman_collection.json" \
            --environment "Corporate Dev.postman_environment.json" \
            --reporters cli,htmlextra,json \
            --reporter-htmlextra-export "./reports/RetailCode-Corporate-Test-Report.html" \
            --reporter-htmlextra-title "RetailCode Corporate API Test Report" \
            --reporter-htmlextra-browserTitle "RetailCode Corporate API Tests" \
            --reporter-htmlextra-showEnvironmentData \
            --reporter-htmlextra-logs \
            --reporter-json-export "./reports/summary.json" \
            --timeout-request 30000 \
            --delay-request 500 \
            --insecure || true

      - name: Build email from test results
        run: node .github/scripts/build-email.js

      - name: Read email subject
        id: email_content
        run: |
          SUBJECT=$(head -1 /tmp/email-subject.txt)
          echo "subject=$SUBJECT" >> $GITHUB_OUTPUT

      - name: Send email report via Gmail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.email_content.outputs.subject }}
          from: RetailCode QA Bot <${{ secrets.GMAIL_USER }}>
          to: |
            oladimeji.ajayi@fbistech.com,
            osayuki.aganmwonyi@fbistech.com,
            stanislaus.odili@fbistech.com,
            gift.alabo@fbistech.com
          cc: eyitemi.abioritsegbemi@fbistech.com
          html_body: file:///tmp/email-body.html
          attachments: ./reports/RetailCode-Corporate-Test-Report.html

      - name: Upload HTML Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-report
          path: ./reports/RetailCode-Corporate-Test-Report.html
          retention-days: 30
